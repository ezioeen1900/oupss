# 底部 Nothing 风格律动条专用 cava 配置（50 频段镜像为 100 对称点阵柱，铺满底边 8/10 宽度，60 FPS）
[general]
bars = 50
framerate = 60

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 72
monstercat = 1
